<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Безопасность в интернете</title>
    <style>
        :root {
            --primary: #667eea;
            --success: #2ecc71;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; color: #333; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; font-size: 28px; margin-bottom: 10px; }
        
        .container { max-width: 700px; margin: 0 auto; }
        .question { background: white; padding: 25px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
        
        .question-text { font-size: 18px; font-weight: 600; margin-bottom: 15px; display: block; }
        
        label { display: block; padding: 12px 15px; margin: 8px 0; border: 2px solid #edf2f7; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        label:hover { background: #f7fafc; border-color: #cbd5e0; }
        
        .explanation { margin-top: 15px; padding: 15px; border-radius: 8px; font-size: 14px; display: none; background: #f8fafc; border-left: 4px solid var(--primary); }
        
        /* Стили для проверки */
        .correct { border-color: var(--success) !important; background: #f0fff4 !important; }
        .wrong { border-color: var(--error) !important; background: #fff5f5 !important; }
        .correct .explanation, .wrong .explanation { display: block; }

        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin: 5px; transition: 0.3s; }
        .btn-check { background: var(--primary); color: white; }
        .btn-check:hover { background: #5a6fd6; transform: translateY(-2px); }
        .btn-reset { background: #cbd5e0; color: #4a5568; }
        
        #result { text-align: center; font-size: 20px; margin: 30px 0; padding: 20px; border-radius: 12px; display: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔒 Безопасность в интернете</h1>
        <p>Пройди тест и узнай, насколько ты защищен</p>
    </div>

    <div class="container" id="quizContainer">
        </div>

    <div style="text-align: center;">
        <button class="btn btn-check" onclick="checkResult()">Проверить ответы</button>
        <button class="btn btn-reset" onclick="resetTest()">Сбросить</button>
    </div>

    <div id="result"></div>

    <script>
        const quizData = [
            { id: 'q1', q: 'Что такое фишинг?', a: 'b', exp: 'Фишинг — это мошенничество, цель которого — украсть ваши пароли или карты с помощью поддельных сайтов.', choices: ['Вид вируса', 'Обман для кражи данных', 'Защита паролей'] },
            { id: 'q2', q: 'Какой пароль считается надёжным?', a: 'c', exp: 'Хороший пароль должен быть длинным (от 12 символов) и содержать смесь букв, цифр и спецсимволов.', choices: ['12345678', 'Имя питомца', 'Сложный набор символов'] },
            { id: 'q3', q: 'Что нужно сделать при получении подозрительного письма?', a: 'c', exp: 'Лучше всего удалить письмо сразу. Не переходите по ссылкам и не скачивайте вложения.', choices: ['Открыть вложение', 'Перейти по ссылке', 'Не открывать и удалить'] },
            { id: 'q4', q: 'Для чего нужна двухфакторная аутентификация?', a: 'a', exp: 'Это дополнительный код (например, в СМС), который защищает аккаунт, даже если кто-то узнал ваш пароль.', choices: ['Для доп. защиты', 'Для ускорения', 'Для блокировки рекламы'] },
            { id: 'q5', q: 'Что опасно делать при подключении к публичному Wi-Fi?', a: 'b', exp: 'В публичных сетях хакеры могут перехватить ваши данные, поэтому ввод паролей или карт запрещен.', choices: ['Читать новости', 'Вводить данные карт', 'Смотреть видео'] },
            { id: 'q6', q: 'Почему не стоит общаться с незнакомцами?', a: 'a', exp: 'Люди в интернете часто выдают себя за других. Никогда не делитесь личными данными.', choices: ['Они не те, за кого себя выдают', 'Это запрещено законом', 'Интернет только для взрослых'] },
            { id: 'q7', q: 'Как часто нужно обновлять пароли?', a: 'b', exp: 'Рекомендуется менять пароли раз в 3–6 месяцев для безопасности.', choices: ['Никогда', 'Раз в 3–6 месяцев', 'Каждый день'] },
            { id: 'q8', q: 'Что такое кибербуллинг?', a: 'b', exp: 'Это травля, оскорбления или запугивание в интернете. С этим нельзя оставаться один на один.', choices: ['Хакерская атака', 'Травля в интернете', 'Онлайн-игра'] },
            { id: 'q9', q: 'Можно ли скачивать программы с неизвестных сайтов?', a: 'b', exp: 'Скачивание со сторонних сайтов — самый простой способ получить вирус на компьютер.', choices: ['Да, если бесплатно', 'Нет, там могут быть вирусы', 'Да, если сайт красивый'] },
            { id: 'q10', q: 'Какую информацию нельзя публиковать?', a: 'b', exp: 'Ваши адреса, телефоны и паспортные данные — это ключ к вашим деньгам и безопасности.', choices: ['Фото с прогулки', 'Адрес и паспортные данные', 'Ссылки на видео'] },
            { id: 'q11', q: 'Что такое антивирус?', a: 'b', exp: 'Антивирус — это программа, которая ищет и блокирует вредоносный код на устройстве.', choices: ['Видеопроигрыватель', 'Защита от вирусов', 'Ускоритель ПК'] },
            { id: 'q12', q: 'Что такое «цифровой след»?', a: 'b', exp: 'Это вся информация, которую вы оставляете в сети: посты, лайки, история поиска. Он остается навсегда.', choices: ['Отпечаток пальца', 'История в интернете', 'Файл cookie'] },
            { id: 'q13', q: 'Вам написали: «Вы выиграли iPhone!». Что делать?', a: 'c', exp: 'Это классическая ловушка мошенников. Бесплатный сыр бывает только в мышеловке.', choices: ['Нажать ссылку', 'Переслать другу', 'Проигнорировать'] },
            { id: 'q14', q: 'Зачем обновлять ОС?', a: 'b', exp: 'Обновления закрывают «дыры» в безопасности, через которые хакеры могут взломать ваш компьютер.', choices: ['Ради обоев', 'Чтобы закрыть уязвимости', 'Это не обязательно'] },
            { id: 'q15', q: 'Что делать, если пытаются обмануть?', a: 'a', exp: 'Никогда не бойтесь рассказать взрослым. Это не стыдно, это единственный правильный шаг.', choices: ['Сообщить взрослым', 'Молчать', 'Ответить тем же'] }
        ];

        const container = document.getElementById('quizContainer');

        // Отрисовка вопросов
        quizData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'question';
            div.id = item.id;
            div.innerHTML = `
                <span class="question-text">${index + 1}. ${item.q}</span>
                ${item.choices.map((choice, i) => `
                    <label>
                        <input type="radio" name="${item.id}" value="${['a', 'b', 'c'][i]}">
                        <span>${['а', 'б', 'в'][i]}) ${choice}</span>
                    </label>
                `).join('')}
                <div class="explanation"><b>Пояснение:</b> ${item.exp}</div>
            `;
            container.appendChild(div);
        });

        function checkResult() {
            let score = 0;
            quizData.forEach(item => {
                const selected = document.querySelector(`input[name="${item.id}"]:checked`);
                const qDiv = document.getElementById(item.id);
                
                if (selected) {
                    if (selected.value === item.a) {
                        qDiv.classList.add('correct');
                        score++;
                    } else {
                        qDiv.classList.add('wrong');
                    }
                } else {
                    qDiv.classList.add('wrong'); // Если не ответил
                }
            });

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `Ваш результат: ${score} из ${quizData.length}`;
            resultDiv.style.background = score > 10 ? '#d1fae5' : '#fee2e2';
        }

        function resetTest() {
            window.location.reload();
        }
    </script>
</body>
</html>
